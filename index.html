<!doctype html>
<html lang="en">

<head>
    <script src="/_sdk/telemetry_sdk.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
        }

        @keyframes bounce-slow {

            0%,
            100% {
                transform: translateY(0) rotate(-3deg);
            }

            50% {
                transform: translateY(-15px) rotate(3deg);
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes progress {
            0% {
                width: 0%;
            }

            100% {
                width: 72%;
            }
        }

        @keyframes spin-slow {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes particle {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0.6;
            }

            100% {
                transform: translateY(-60px) scale(0);
                opacity: 0;
            }
        }

        .bounce-slow {
            animation: bounce-slow 2.5s ease-in-out infinite;
        }

        .float {
            animation: float 3s ease-in-out infinite;
        }

        .progress-fill {
            animation: progress 2s ease-out forwards;
        }

        .spin-slow {
            animation: spin-slow 10s linear infinite;
        }

        .fade-in {
            animation: fadeIn 1s ease-out forwards;
            opacity: 0;
        }

        .stagger-1 {
            animation-delay: 0.2s;
        }

        .stagger-2 {
            animation-delay: 0.4s;
        }

        .stagger-3 {
            animation-delay: 0.6s;
        }

        .glow-dot {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #10b981;
            border-radius: 50%;
            opacity: 0.4;
        }

        @keyframes particle-float {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(-120px) translateX(var(--tx)) rotate(360deg);
                opacity: 0;
            }
        }

        .particle {
            position: fixed;
            font-size: 1.5rem;
            pointer-events: none;
            animation: particle-float 4s ease-out forwards;
        }

        .particle-fast {
            animation-duration: 3s;
        }

        .particle-slow {
            animation-duration: 5s;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js" type="text/javascript"></script>
    <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
    <script src="/_sdk/resizing_sdk.js" type="text/javascript"></script>
</head>

<body data-template-id="__page-root" class="min-h-screen flex items-center justify-center overflow-hidden relative"
    style="background: linear-gradient(135deg, rgb(10, 26, 20), rgb(13, 40, 24), rgb(9, 26, 18));">
    <!-- Floating particles -->
    <div class="glow-dot" style="top:15%;left:10%;animation:float 4s ease-in-out infinite"></div>
    <div class="glow-dot"
        style="top:30%;right:15%;animation:float 3.5s ease-in-out infinite;animation-delay:1s;width:6px;height:6px">
    </div>
    <div class="glow-dot" style="bottom:25%;left:20%;animation:float 5s ease-in-out infinite;animation-delay:0.5s">
    </div>
    <div class="glow-dot"
        style="top:60%;right:25%;animation:float 4.5s ease-in-out infinite;animation-delay:2s;width:5px;height:5px">
    </div>
    <div class="glow-dot"
        style="top:10%;right:40%;animation:float 3s ease-in-out infinite;animation-delay:1.5s;width:3px;height:3px">
    </div>
    <div class="glow-dot" style="bottom:15%;right:10%;animation:float 4s ease-in-out infinite;animation-delay:0.8s">
    </div>
    <div class="absolute top-12 left-12 text-5xl spin-slow opacity-20">
        ⚙️
    </div>
    <div class="absolute bottom-20 right-16 text-4xl float opacity-20">
        🔧
    </div>
    <main class="text-center px-6 max-w-2xl mx-auto relative z-10">
        <div class="text-7xl md:text-8xl bounce-slow mb-8">
            🏗️
        </div>
        <h1 data-template-id="main-heading" class="canva-text font-bold text-3xl md:text-5xl leading-tight mb-6 fade-in"
            style="color: rgb(255, 255, 255); font-weight: 700; font-style: normal; font-size: 32px;">Under Construction
        </h1>
        <p data-template-id="subtitle" class="canva-text text-lg md:text-xl mb-10 fade-in stagger-1"
            style="color: rgb(167, 243, 208); font-weight: 400; font-style: normal; font-size: 18px;">We're working on
            bringing you something amazing. Coming soon!</p>
        <div class="w-full max-w-md mx-auto rounded-full h-3 overflow-hidden mb-4 fade-in stagger-2"
            style="background:rgba(255,255,255,0.1);">
            <div id="progress-bar" data-template-id="progress-bar" class="canva-section h-full rounded-full"
                style="width: 0px; transition: width 0.3s ease-out; background: rgb(16, 185, 129);"></div>
        </div>
        <p id="progress-label" data-template-id="progress-label" class="canva-text text-sm fade-in stagger-3"
            style="color: rgb(110, 231, 183); font-weight: 400; font-style: normal; font-size: 14px;">Progress: ~0%</p>
    </main>
    <div id="particle-container"
        style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5;"></div>
    <script src="/_sdk/editing_sdk.js"></script>
    <script>
        // Particle generation - tech/computing themed
        const particles = ['💻', '🖥️', '⌨️', '🖱️', '📱', '⚙️', '🔧', '🔩', '💾', '🔌', '📡', '🛰️', '🤖', '🚀', '📊', '📈', '<', '>', '{', '}', '/', '\\', '|', '[', ']', '(', ')', '=', '+', '-', '*'];
        const container = document.getElementById('particle-container');

        function createParticle() {
            const particle = document.createElement('div');
            particle.className = 'particle';
            if (Math.random() > 0.5) particle.classList.add('particle-fast');
            else particle.classList.add('particle-slow');

            particle.textContent = particles[Math.floor(Math.random() * particles.length)];

            // Random position across entire screen width
            const x = Math.random() * window.innerWidth;
            const y = window.innerHeight + 20;
            const tx = (Math.random() - 0.5) * 300;

            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            particle.style.setProperty('--tx', tx + 'px');

            container.appendChild(particle);

            setTimeout(() => particle.remove(), 5000);
        }

        // Spawn particles more frequently for fuller screen
        setInterval(createParticle, 400);

        // Random progress bar cycles
        const progressBar = document.getElementById('progress-bar');
        const progressLabel = document.getElementById('progress-label');

        async function animateProgressCycle() {
            while (true) {
                // Random target between 60 and 98
                const target = Math.floor(Math.random() * 38) + 60;
                const duration = Math.floor(Math.random() * 3000) + 3000; // 3-6 seconds
                const startTime = Date.now();

                // Animate up to target
                while (Date.now() - startTime < duration) {
                    const progress = ((Date.now() - startTime) / duration) * target;
                    progressBar.style.width = progress + '%';
                    progressLabel.textContent = `Progress: ~${Math.floor(progress)}%`;
                    await new Promise(r => requestAnimationFrame(r));
                }

                progressBar.style.width = target + '%';
                progressLabel.textContent = `Progress: ~${target}%`;

                // Hold for a moment
                await new Promise(r => setTimeout(r, 800));

                // Reset to 0
                progressBar.style.width = '0%';
                progressLabel.textContent = 'Progress: ~0%';

                // Wait before next cycle
                await new Promise(r => setTimeout(r, 1000));
            }
        }

        animateProgressCycle();
    </script>

</html>
